<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>AI Travel Itinerary Generator</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen">

  <div class="max-w-4xl mx-auto p-6">

    <h1 class="text-5xl font-bold text-center mb-3">
      ✈️ AI Travel Itinerary Generator
    </h1>

    <p class="text-center text-slate-300 mb-10">
      Generate smart AI-powered travel plans instantly
    </p>

    <div class="bg-slate-800 p-6 rounded-2xl shadow-lg">

      <label class="block mb-2 text-lg">
        Destination
      </label>

      <input
        type="text"
        id="destination"
        placeholder="Example: Goa"
        class="w-full p-4 rounded-xl text-black mb-5"
      />


      <label class="block mb-2 text-lg">
        Number of Days
      </label>

      <input
        type="number"
        id="days"
        placeholder="Example: 5"
        class="w-full p-4 rounded-xl text-black mb-5"
      />


      <label class="block mb-2 text-lg">
        Budget Type
      </label>

      <select
        id="budget"
        class="w-full p-4 rounded-xl text-black mb-5"
      >
        <option value="">Select Budget</option>
        <option value="Budget Friendly">Budget Friendly</option>
        <option value="Mid Range">Mid Range</option>
        <option value="Luxury">Luxury</option>
      </select>


      <button
        onclick="generateTrip()"
        class="bg-blue-500 hover:bg-blue-600 w-full py-4 rounded-xl font-semibold text-lg transition"
      >
        Generate Travel Plan
      </button>


      <div
        id="output"
        class="bg-slate-900 mt-6 p-5 rounded-xl whitespace-pre-wrap"
      ></div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
